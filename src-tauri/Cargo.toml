[package]
name = "ide33"
version = "0.1.0"
edition = "2021"

[features]
default = ["basic"]
basic = []
advanced = ["cph", "browser", "ai_translate"]
ultimate = ["advanced", "ai_suggest"]
cph = []
browser = []
ai_translate = []
ai_suggest = []

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

tauri-plugin-dialog = "2.7.1"
tauri-plugin-clipboard-manager = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
