name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Download MinGW compiler (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $url = "https://github.com/nicedoc/winlibs/releases/download/v9.3.0/winlibs-x86_64-posix-seh-gcc9.3.0-mingw-w64-7.0.0-r1.7z"
          Invoke-WebRequest -Uri $url -OutFile mingw.7z
          7z x mingw.7z -otools/mingw64 -y | Out-Null
        continue-on-error: true

      - name: Download MinGW compiler (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          brew install gcc
          mkdir -p tools/mac/bin
          ln -sf /usr/local/bin/g++-* tools/mac/bin/g++ || true
          ln -sf /opt/homebrew/bin/g++-* tools/mac/bin/g++ || true

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 33IDE Lite ${{ github.ref_name }}
          releaseBody: |
            ## 33IDE Lite ${{ github.ref_name }}
            
            面向 OI 选手的轻量级算法竞赛 IDE，内置 g++ 编译器，开箱即用。
            
            ### 下载说明
            - **Windows**: 下载 `.msi` 或 `.exe` 安装包
            - **macOS**: 下载 `.dmg` 安装包（Apple Silicon 选 arm64，Intel 选 x64）
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Publish release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          generate_release_notes: true
